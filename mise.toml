[tasks.brew]
description = "Install the Brewfile packages on macOS"
raw = true
run = "brew bundle --file=Brewfile --verbose"

[tasks.setup]
description = "Link dotfiles into $HOME with stow"
run = '''
#!/usr/bin/env bash
set -euo pipefail
packages=(agents claude git mise pi starship)
if [ "$(uname)" = Linux ]; then
  packages+=(bash gnupg hypr)
else
  packages+=(gnupg-macos mise-macos zsh)
fi
stow --no-folding --target="$HOME" "$@" "${packages[@]}"
'''
